workflows:
  ios-app:
    name: iOS App

    max_build_duration: 120

    integrations:
      developer_portal: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        APP_ID: 6742501423
        APPLE_ID: ""
        APP_SPECIFIC_PASSWORD: ""

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chatbill.app

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Flutter build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        apple_id: $APPLE_ID
        app_specific_password: $APP_SPECIFIC_PASSWORD
        submit_to_testflight: true

      email:
        recipients:
          - 1571461819@qq.com
