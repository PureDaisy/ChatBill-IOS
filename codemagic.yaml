workflows:
  ios-app:
    name: iOS App
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Set iOS Deployment Target
        script: |
          sed -i 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/' ios/Runner.xcodeproj/project.pbxproj
      - name: Set Podfile minimum iOS version
        script: |
          sed -i 's/platform :ios, .*/platform :ios, '\''13.0'\''/' ios/Podfile
      - name: Run pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: List available schemes
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -list || xcodebuild -project Runner.xcodeproj -list
      - name: Build iOS for Simulator
        script: |
          flutter build ios --simulator --no-codesign 2>&1
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - 1571461819@qq.com
        notify:
          on_build_start: false
          on_build_success: true
          on_build_failure: true
