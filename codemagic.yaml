workflows:
  ios-app:
    name: iOS App
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: List available schemes
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -list || xcodebuild -project Runner.xcodeproj -list
      - name: Build iOS for Simulator
        script: |
          flutter build ios --simulator --no-codesign 2>&1
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - 1571461819@qq.com
