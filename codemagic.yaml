workflows:
  ios-app:
    name: iOS App

    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic   # ⭐关键补这一行

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chatbill.app

    scripts:
      - flutter pub get

      - cd ios && pod install --repo-update && cd ..

      - xcode-project use-profiles

      - flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - 1571461819@qq.com
